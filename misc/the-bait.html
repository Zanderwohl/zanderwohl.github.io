---
title: The Bait
description: John Donne's "The Bait," one of two poems I memorized in twelfth grade.

<figure class="poem">
  <blockquote>
    <p>
      Come live with me, and be my love,<br>
      And we will some new pleasures prove<br>
      Of golden sands, and crystal brooks,<br>
      With silken lines, and silver hooks.
    </p>

    <p>
      There will the river whispering run<br>
      Warm&rsquo;d by thy eyes, more than the sun;<br>
      And there the &rsquo;enamour&rsquo;d fish will stay,<br>
      Begging themselves they may betray.
    </p>

    <p>
      When thou wilt swim in that live bath,<br>
      Each fish, which every channel hath,<br>
      Will amorously to thee swim,<br>
      Gladder to catch thee, than thou him.
    </p>

    <p>
      If thou, to be so seen, be&rsquo;st loth,<br>
      By sun or moon, thou dark&rsquo;nest both,<br>
      And if myself have leave to see,<br>
      I need not their light having thee.
    </p>

    <p>
      Let others freeze with angling reeds,<br>
      And cut their legs with shells and weeds,<br>
      Or treacherously poor fish beset,<br>
      With strangling snare, or windowy net.
    </p>

    <p>
      Let coarse bold hands from slimy nest<br>
      The bedded fish in banks out-wrest;<br>
      Or curious traitors, sleeve-silk flies,<br>
      Bewitch poor fishes&rsquo; wand&rsquo;ring eyes.
    </p>

    <p>
      For thee, thou need&rsquo;st no such deceit,<br>
      For thou thyself art thine own bait:<br>
      That fish, that is not catch&rsquo;d thereby,<br>
      Alas, is wiser far than I.
    </p>
  </blockquote>

  <figcaption>
    <cite>The Bait</cite>, John Donne.
  </figcaption>
</figure>
