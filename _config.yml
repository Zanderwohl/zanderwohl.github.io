title: Alexander Lowry
tagline: Programmer
description: >-
  Software engineer. Notes on code, models and miniatures, and things worth
  memorizing.
author: Alexander Lowry
lang: en

# GitHub Pages, served from Zanderwohl/zanderwohl.github.io on the custom domain
# in ./CNAME. The site lives at the domain root, so baseurl must stay empty.
# zanderwohl.github.io redirects here once the custom domain is set.
domain: zanderlowry.com       # bare hostname, no protocol
url: "https://zanderlowry.com"  # base hostname and protocol
baseurl: ""                     # empty: site lives at the domain root

permalink: /posts/:title/

markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "misc"
    values:
      layout: page
      section: Misc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
